name: SmartPicker Pro V5.0 全平台构建

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: 构建于 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: SmartPicker-Pro-Windows.exe
          - os: macos-latest
            asset_name: SmartPicker-Pro-macOS.zip
          - os: ubuntu-latest
            asset_name: SmartPicker-Pro-Linux

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 📦 安装核心依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame openpyxl fpdf python-docx matplotlib Pillow psutil

      - name: 🪟 安装 Windows 专属依赖
        if: matrix.os == 'windows-latest'
        run: pip install pywin32

      - name: 🔨 执行 PyInstaller 打包
        run: |
          pyinstaller --noconsole --onefile --clean --name "SmartPicker-Pro" dianming.py

      - name: 📦 资源隔离重命名与压缩 (防止并发踩踏)
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv SmartPicker-Pro.exe ${{ matrix.asset_name }}
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            zip -r ${{ matrix.asset_name }} SmartPicker-Pro.app
          else
            mv SmartPicker-Pro ${{ matrix.asset_name }}
          fi

      - name: 🚀 上传独立产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
