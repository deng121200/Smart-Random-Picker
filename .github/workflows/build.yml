name: SmartPicker Pro V5.0 全平台构建矩阵

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: 构建于 ${{ matrix.os }}
    # 核心进化：矩阵策略，同时启动 Win, Mac, Linux 三台机器并行打包
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 📦 安装核心跨平台生态依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame openpyxl fpdf python-docx matplotlib Pillow psutil

      - name: 🪟 安装 Windows 专属依赖 (语音播报支持)
        if: matrix.os == 'windows-latest'
        run: pip install pywin32

      - name: 🔨 执行全平台 PyInstaller 打包
        run: |
          pyinstaller --noconsole --onefile --clean --name "SmartPicker-Pro" dianming.py

      - name: 🚀 汇聚并发布全平台产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SmartPicker-Pro.exe
            dist/SmartPicker-Pro
            dist/SmartPicker-Pro.app/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
